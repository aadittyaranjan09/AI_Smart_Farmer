<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - AI Smart Farmer</title>
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI';
}

/* 🌄 FULL BACKGROUND */
body {
  height: 100vh;
  background: url("l2.png") no-repeat center center/cover;
}

/* Overlay container */
.hero {
  position: relative;
  width: 100%;
  height: 100vh;
}

/* 🌱 LEFT TEXT */
.left-text {
  position: absolute;
  top: 60px;
  left: 60px;
  color: #2e7d32;
}

.left-text h1 {
  font-size: 60px;
  font-weight: bold;
}

/* 💎 LOGIN CARD (OVERLAP EFFECT) */
.login-card {
  position: absolute;
  right: 80px;
  top: 50%;
  transform: translateY(-50%);

  width: 420px;
  padding: 40px;

  background: rgba(255, 255, 255, 0.95);
  border-radius: 20px;

  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
}

/* Title */
.login-card h2 {
  text-align: center;
  margin-bottom: 20px;
}

/* Social Buttons */
.social {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

.social button {
  flex: 1;
  padding: 10px;
  border: none;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

.google { background: #db4437; }
.facebook { background: #3b5998; }
.instagram { background: #e4405f; }

/* Divider */
.divider {
  text-align: center;
  margin: 15px 0;
  color: gray;
}

/* Inputs */
input {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

/* Options */
.options {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  margin-bottom: 10px;
}

/* Terms */
.terms {
  font-size: 12px;
  color: gray;
  margin-bottom: 15px;
}

/* Login Button */
.login-btn {
  width: 100%;
  padding: 12px;
  background: #4a7c46;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

/* Signup */
.signup {
  text-align: center;
  margin-top: 15px;
}

/* 📱 Responsive */
@media(max-width: 768px) {
  .login-card {
    position: static;
    transform: none;
    margin: 20px;
    width: auto;
  }

  .left-text {
    position: static;
    text-align: center;
    margin-top: 20px;
  }
}
  </style>
</head>
<body>

<!-- Background Content -->
<div class="hero">

  <!-- Left Text -->
  <div class="left-text">
    <h1>AI Smart<br>Farmer</h1>
  </div>

  <!-- Login Card -->
  <div class="login-card">

    <h2>Login to Your Account</h2>

    <!-- Social Buttons -->
    <div class="social">
      <button class="google">Google</button>
      <button class="facebook">Facebook</button>
      <button class="instagram">Instagram</button>
    </div>

    <div class="divider">or</div>

    <!-- Form -->
    <input type="email" placeholder="Enter Email">
    <input type="password" placeholder="Enter Password">

    <div class="options">
      <label><input type="checkbox"> Remember me</label>
      <a href="#">Forgot your password?</a>
    </div>

    <p class="terms">
      By continuing, you agree to farmers platform’s
      <a href="#">Terms of Use</a> and
      <a href="#">Privacy Policy</a>.
    </p>

    <button class="login-btn">LOGIN</button>

    <p class="signup">
      New to farmers platform? <a href="signup.html">Create an account</a>
    </p>

  </div>

</div>

</body>
</html>
